name: 提个建议
description: 想要新功能，或者觉得某处用起来别扭
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你现在是怎么做的
      description: 先说现状——在哪个模块、卡在哪一步、要多点几下还是得绕开。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望它变成什么样
      description: 描述使用感受即可，不用替我想实现方式。
    validations:
      required: true

  - type: dropdown
    id: domain
    attributes:
      label: 涉及哪个模块
      options:
        - 首页 / 今日回顾 / 设置面板 / 数据体检
        - 日记本
        - 备忘录
        - 归物本
        - 剪藏本
        - 书库 / 阅读分析
        - 影院 / 影视分析
        - 游戏库
        - 收藏本
        - 第二大脑
        - 知识盒
        - 复习计划
        - 番茄钟
        - 保险库 / 密码本
        - 自动摘要 / 附件搬移
        - 工具坞
        - 小橘
        - 跨模块 / 说不清
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过别的办法吗
      description: 别的插件、脚本、手动流程都算。有的话说一句哪里不够用。
    validations:
      required: false
