name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 开发机是 Windows，一批守卫按平台分支（win32 判定、路径分隔符、junction）；
    # 换 ubuntu 跑会得到「本地绿、CI 红」这种最没用的信号，所以直接对齐开发环境。
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # test-affected 要用 git diff 找改动，浅克隆拿不到基线
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: npx tsc --noEmit

      # PR：只跑改动波及的测试（选择器自己会升格为全量）
      - name: 测试（PR）
        if: github.event_name == 'pull_request'
        run: node scripts/test-affected.mjs --since origin/${{ github.base_ref }}

      # 主干：合并后的真相，跑全量
      - name: 测试（主干）
        if: github.event_name == 'push'
        run: node scripts/test-affected.mjs --full
